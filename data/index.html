<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESP32 LED Matrix Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Header -->
    <h1>ESP32 Matrix Control</h1>
    
    <!-- NEW: Tab Navigation -->
    <div class="tab-nav">
        <button class="tab-btn active" data-target="workspaceTab">WORKSPACE</button>
        <button class="tab-btn" data-target="settingsTab">SETTINGS</button>
    </div>

    <!-- TAB 1: WORKSPACE (Drawing & Tools) -->
    <div id="workspaceTab" class="tab-content active">
        <div class="toolbar">
            <div class="picker-container">
                <span class="picker-label">COLOR PICKER</span>
                <input type="color" id="colorPicker" value="#ffffff">
            </div>
            <button id="eraserBtn">Eraser: OFF</button>
        </div>

        <div class="preset-container">
            <span class="picker-label">PRESET COLORS</span>
            <div id="colorPresets" class="preset-grid"></div>
        </div>

        <div id="matrixGrid"></div>

        <div class="action-buttons">
            <button id="clearBtn">CLEAR</button>
            <button id="deployBtn">DEPLOY</button>
        </div>
    </div>

    <!-- TAB 2: SETTINGS (Hardware Configurations) -->
    <div id="settingsTab" class="tab-content">
        <div class="brightness-container">
            <span class="picker-label">BRIGHTNESS: <span id="brightVal">50</span></span>
            <div class="slider-wrapper">
                <input type="range" id="brightnessSlider" min="5" max="255" value="50">
                <div class="limit-mark" title="Safety Limit: 120"></div>
            </div>
        </div>
        
        <!-- Danger Zone (Unlock Max Brightness) -->
        <div class="danger-zone">
            <button id="unlockBtn">[!] UNLOCK MAX BRIGHTNESS [!]</button>
            <p class="warning-text">REQUIREMENT: External Power Supply (5V - Minimum 4A).</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
